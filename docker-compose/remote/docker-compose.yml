version: '3.9'

services:
  host:
    build:
      context: .
      dockerfile: ./dockerfile-host
    container_name: host
    ports:
      - "80:80"
    depends_on:
      - admin

  admin:
    build:
      context: .
      dockerfile: ./dockerfile-remote
      args:
        DIST_PATH: ./dist/r/admin
    container_name: admin
    ports:
      - "5009:80"