version: '3.9'

services:
  host:
    build:
      context: .
      dockerfile: ./dockerfile-host
    container_name: host
    ports:
      - "80:80"
    depends_on:
      - rca

  rca:
    build:
      context: .
      dockerfile: ./dockerfile-remote
      args:
        DIST_PATH: ./dist/r/rca
    container_name: rca
    ports:
      - "5001:80"